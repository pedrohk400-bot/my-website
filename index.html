
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>PED SAN</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(ellipse at 50% 42%,
        #3b000c 0%, #150005 35%, #050505 75%);
    font-family: Arial, sans-serif;
    color: white;
}

.container {
    width: 90%;
    max-width: 380px;
    text-align: center;
    padding: 45px 22px;
    border: 1px solid #570012;
    border-radius: 24px;
    background: rgba(15, 5, 7, 0.75);
    box-shadow: 0 0 45px rgba(220, 0, 40, 0.12);
}

.logo {
    width: 100px;
    height: 100px;
    margin: 0 auto 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 25px;
    border: 1px solid #ff2449;
    background: linear-gradient(145deg, #b00024, #180006);
    box-shadow: 0 0 30px rgba(255, 0, 50, 0.25);
    font-size: 30px;
    font-weight: 900;
    letter-spacing: -2px;
}

h1 {
    font-size: 36px;
    letter-spacing: 4px;
    margin-bottom: 35px;
    text-shadow: 0 0 20px rgba(255, 0, 45, 0.4);
}

.download {
    display: block;
    width: 100%;
    padding: 16px;
    color: white;
    text-decoration: none;
    font-size: 17px;
    font-weight: bold;
    border-radius: 13px;
    border: 1px solid #ff526d;
    background: linear-gradient(100deg, #a80020, #ed1239);
    box-shadow: 0 5px 25px rgba(220, 0, 40, 0.22);
    transition: 0.2s;
}

.download:active {
    transform: scale(0.96);
}

</style>
</head>

<body>

<div class="container">

    <div class="logo">PS</div>

    <h1>PED SAN</h1>

    <a class="download"
       href="https://drive.google.com/uc?export=download&id=1V9MyEawmnBK6OFYDRR5o3lhxFiX4ale-">
       تحميل التطبيق
    </a>

</div>

</body>
</html>
